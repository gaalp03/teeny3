<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1140">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Teeny Titans 3</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <style>
    @font-face {
      font-family: 'TT3 Display';
      src: url('assets/fonts/TT3Display.woff2') format('woff2');
      font-display: swap;
    }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0d0820; touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; outline: none; image-rendering: auto; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ffd23f; font: 28px 'TT3 Display', 'Trebuchet MS', sans-serif; letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="loading">Teeny Titans 3 töltődik…</div>
  <canvas id="game" tabindex="0"></canvas>

  <script src="src/engine/util.js"></script>

  <script src="src/data/achievements.js"></script>
  <script src="src/data/quests.js"></script>
  <script src="src/data/news.js"></script>
  <script src="src/data/events.js"></script>

  <script src="src/art/figure.js"></script>
  <script src="src/art/tiles.js"></script>
  <script src="src/art/buildings.js"></script>

  <script src="src/scenes/world.js"></script>
  <script src="src/scenes/tower.js"></script>
  <script src="src/scenes/battle.js"></script>
  <script src="src/scenes/shop.js"></script>
