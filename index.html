<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1140">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Teeny Titans 3</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <style>
    @font-face {
      font-family: 'Lilita One';
      src: url('assets/fonts/LilitaOne-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Lilita One';
      src: url('assets/fonts/LilitaOne-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F;
    }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0d0820; touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; outline: none; image-rendering: auto; }
    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ffd23f; font: 28px 'Lilita One', 'Trebuchet MS', sans-serif; letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="loading">Teeny Titans 3 töltődik…</div>
  <canvas id="game" tabindex="0"></canvas>

  <script src="src/engine/util.js"></script>
  <script src="src/engine/core.js"></script>
  <script src="src/engine/input.js"></script>
  <script src="src/engine/audio.js"></script>
  <script src="src/engine/draw.js"></script>
  <script src="src/engine/fx.js"></script>
  <script src="src/engine/ui.js"></script>
  <script src="src/engine/save.js"></script>
  <script src="src/engine/custom.js"></script>

  <script src="src/data/types.js"></script>
  <script src="src/data/moves.js"></script>
  <script src="src/data/figures.js"></script>
  <script src="src/data/progress.js"></script>
  <script src="src/data/world.js"></script>
  <script src="src/data/achievements.js"></script>

  <script src="src/art/figure.js"></script>
  <script src="src/art/tiles.js"></script>
  <script src="src/art/buildings.js"></script>
  <script src="src/art/backdrops.js"></script>

  <script src="src/scenes/title.js"></script>
  <script src="src/scenes/world.js"></script>
  <script src="src/scenes/tower.js"></script>
  <script src="src/scenes/battle.js"></script>
  <script src="src/scenes/shop.js"></script>
  <script src="src/scenes/pizzagame.js"></script>
  <script src="src/scenes/dome.js"></script>
  <script src="src/scenes/collection.js"></script>
  <script src="src/scenes/credits.js"></script>

  <script src="src/main.js"></script>
</body>
</html>
