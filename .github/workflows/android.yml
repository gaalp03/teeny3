name: Android APK

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Függőségek
        run: npm ci --no-audit --no-fund

      - name: Saját textúrák (APK az apk-forras ágon vagy az apk-forras kiadásban)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir -p apk
          BRANCH=
          FROM_RELEASE=
          # a kiadás címkéje is "apk-forras", ezért teljes hivatkozással kérjük az ágat
          if git fetch --depth 1 origin refs/heads/apk-forras 2>/dev/null; then
            BRANCH=$(git rev-parse FETCH_HEAD)
            git checkout FETCH_HEAD -- apk 2>/dev/null || true
          fi
          pkgs=(apk/*.apk apk/*.xapk apk/*.apks apk/*.obb)
          if [ ${#pkgs[@]} -eq 0 ]; then
            # nagy fájl: a felhasználó egy "apk-forras" nevű kiadáshoz csatolta
            gh release download apk-forras --dir apk --pattern '*.apk' --pattern '*.xapk' --pattern '*.apks' --pattern '*.obb' 2>/dev/null || true
            pkgs=(apk/*.apk apk/*.xapk apk/*.apks apk/*.obb)
            if [ ${#pkgs[@]} -gt 0 ]; then FROM_RELEASE=1; fi
          fi
          if [ ${#pkgs[@]} -gt 0 ]; then
            for f in "${pkgs[@]}"; do
              echo "== $f: a 40 legnagyobb fájl =="
              unzip -l "$f" | sort -k1 -n -r | head -40 || true
            done
            pip install --quiet UnityPy || echo "UnityPy nélkül csak a sima képek jönnek ki"
            for f in "${pkgs[@]}"; do python3 tools/extract_apk.py extract "$f" || echo "Hiba a kinyeréskor: $f"; done
            if [ -f apk/map.json ]; then
              python3 tools/extract_apk.py map apk/map.json || echo "A párosítás nem sikerült, textúrák nélkül folytatom"
            elif [ -n "$BRANCH" ] && [ ! -d apk/kepek ]; then
              # első alkalom: kicsinyített előnézet az apk-forras ágra a figurák párosításához
              python3 tools/extract_apk.py thumbs "$RUNNER_TEMP/kepek" || true
              # (az || miatt a set -e itt nem hatna, ezért minden lépés &&-gyel láncolva)
              git worktree add "$RUNNER_TEMP/af" "$BRANCH" \
                && mkdir -p "$RUNNER_TEMP/af/apk" \
                && cp -r "$RUNNER_TEMP/kepek" "$RUNNER_TEMP/af/apk/kepek" \
                && git -C "$RUNNER_TEMP/af" add apk/kepek \
                && if [ -n "$FROM_RELEASE" ]; then
                  # a kiadásból jött csomag is kerüljön az ágra (100 MB alatt), hogy a kinyerést javítani lehessen
                  for f in "${pkgs[@]}"; do
                    sz=$(stat -c %s "$f")
                    if [ "$sz" -lt 95000000 ]; then cp "$f" "$RUNNER_TEMP/af/apk/" && git -C "$RUNNER_TEMP/af" add "apk/$(basename "$f")"; fi
                  done
                fi \
                && git -C "$RUNNER_TEMP/af" -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -q -m "Kinyert képek előnézete a párosításhoz" \
                && git -C "$RUNNER_TEMP/af" push origin HEAD:refs/heads/apk-forras \
                || echo "Az előnézet feltöltése nem sikerült"
            fi
          fi
          # a nyers kinyert képek ne kerüljenek az APK-ba, csak a párosítottak
          rm -rf apk assets/custom/raw assets/custom/_tmp assets/custom/map.example.json

      - name: Android projekt előkészítése
        run: npm run android

      - name: APK fordítása
        working-directory: android
        run: |
          mkdir -p ~/.android
          cp ../android-signing/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../TeenyTitans3.apk

      - name: APK feltöltése (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: teeny-titans-3-apk
          path: TeenyTitans3.apk
          if-no-files-found: error

      - name: Legújabb kiadás frissítése (közvetlen letöltés telefonra)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release delete legujabb --cleanup-tag -y || true
            sleep 3
            if gh release create legujabb TeenyTitans3.apk \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Teeny Titans 3 – legújabb (1.${{ github.run_number }})" \
              --notes "Automatikus build a(z) ${GITHUB_REF_NAME} ágról. Telefonon: töltsd le a TeenyTitans3.apk-t és telepítsd. A frissítés megtartja a mentést."; then
              exit 0
            fi
            sleep $((i * 10))
          done
          exit 1
