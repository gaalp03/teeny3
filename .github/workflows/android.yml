name: Android APK

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Függőségek
        run: npm ci --no-audit --no-fund

      # A kinyerés (8–20 perc) eredménye gyorsítótárba kerül: csak akkor fut újra, ha az apk-forras ág
      # (párosítások, csomag), a kiadáshoz csatolt csomagok vagy a kinyerő eszközök megváltoztak
      - name: Kinyerés kulcsa
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AF=$(git ls-remote origin refs/heads/apk-forras | cut -f1)
          REL=$(gh release view apk-forras --json assets -q '.assets[] | .name + ":" + (.size|tostring)' 2>/dev/null | sort || true)
          K=$(printf '%s\n%s\n%s\n' "$AF" "$REL" "${{ hashFiles('tools/*.py') }}" | sha256sum | cut -c1-40)
          echo "key=$K" >> "$GITHUB_OUTPUT"
          echo "Kinyerés kulcsa: $K (apk-forras: $AF)"

      - name: Kinyert tartalom a gyorsítótárból
        id: cache
        uses: actions/cache@v4
        with:
          path: assets/custom
          key: tt2-custom-${{ steps.key.outputs.key }}

      - name: Saját textúrák (APK az apk-forras ágon vagy az apk-forras kiadásban)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir -p apk
          BRANCH=
          # a kiadás címkéje is "apk-forras", ezért teljes hivatkozással kérjük az ágat
          if git fetch --depth 1 origin refs/heads/apk-forras 2>/dev/null; then
            BRANCH=$(git rev-parse FETCH_HEAD)
            git checkout FETCH_HEAD -- apk 2>/dev/null || true
          fi
          # a darabolt ideiglenes másolat letöltve: az ág törölhető
          if [ -f apk/nyers-kesz ] && git ls-remote --exit-code origin refs/heads/apk-nyers >/dev/null 2>&1; then
            git push origin --delete refs/heads/apk-nyers || echo "Az apk-nyers ág törlése nem sikerült"
          fi
          onbranch=(apk/*.apk apk/*.xapk apk/*.apks apk/*.obb apk/*.zip)
          # nagy fájlok (pl. a játék .obb kiegészítője vagy a letöltési gyorsítótár zipben): az "apk-forras" nevű kiadáshoz csatolva
          gh release download apk-forras --dir apk --skip-existing --pattern '*.apk' --pattern '*.xapk' --pattern '*.apks' --pattern '*.obb' --pattern '*.zip' 2>/dev/null || true
          pkgs=(apk/*.apk apk/*.xapk apk/*.apks apk/*.obb apk/*.zip)
          if [ ${#pkgs[@]} -gt 0 ]; then
            SIG=$(for f in "${pkgs[@]}"; do echo "$(basename "$f") $(stat -c %s "$f")"; done)
            echo "== Csomagok ==" && echo "$SIG"
            for f in "${pkgs[@]}"; do
              echo "== $f: a 40 legnagyobb fájl =="
              unzip -l "$f" | sort -k1 -n -r | head -40 || true
            done
            command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg >/dev/null || true
            pip install --quiet UnityPy numpy || echo "UnityPy nélkül csak a sima képek jönnek ki"
            for f in "${pkgs[@]}"; do python3 tools/extract_apk.py extract "$f" || echo "Hiba a kinyeréskor: $f"; done
            if [ -f apk/map.json ]; then
              python3 tools/extract_apk.py map apk/map.json || echo "A párosítás nem sikerült, textúrák nélkül folytatom"
            elif [ -n "$BRANCH" ] && [ "$SIG" != "$(cat apk/kepek/forras.txt 2>/dev/null)" ]; then
              # új csomag jött: kicsinyített előnézet az apk-forras ágra a figurák párosításához
              python3 tools/extract_apk.py thumbs "$RUNNER_TEMP/kepek" || true
              mkdir -p "$RUNNER_TEMP/kepek"
              echo "$SIG" > "$RUNNER_TEMP/kepek/forras.txt"
              # (az || miatt a set -e itt nem hatna, ezért minden lépés &&-gyel láncolva)
              git worktree add "$RUNNER_TEMP/af" "$BRANCH" \
                && rm -rf "$RUNNER_TEMP/af/apk/kepek" \
                && mkdir -p "$RUNNER_TEMP/af/apk" \
                && cp -r "$RUNNER_TEMP/kepek" "$RUNNER_TEMP/af/apk/kepek" \
                && git -C "$RUNNER_TEMP/af" add -A apk/kepek \
                && for f in "${pkgs[@]}"; do
                  # a kiadásból jött kisebb csomag is kerüljön az ágra, hogy a kinyerést javítani lehessen
                  case " ${onbranch[*]} " in *" $f "*) continue ;; esac
                  if [ "$(stat -c %s "$f")" -lt 95000000 ]; then cp "$f" "$RUNNER_TEMP/af/apk/" && git -C "$RUNNER_TEMP/af" add "apk/$(basename "$f")"; fi
                done \
                && git -C "$RUNNER_TEMP/af" -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -q -m "Kinyert képek előnézete a párosításhoz" \
                && git -C "$RUNNER_TEMP/af" push origin HEAD:refs/heads/apk-forras \
                || echo "Az előnézet feltöltése nem sikerült"
            fi
            # a nagy csomagok (pl. .obb) egyszer darabolva egy külön ágra, hogy a 3D figurák renderelése helyben is fejleszthető legyen
            big=()
            for f in "${pkgs[@]}"; do if [ "$(stat -c %s "$f")" -ge 95000000 ]; then big+=("$f"); fi; done
            if [ ${#big[@]} -gt 0 ] && [ -n "$BRANCH" ] && [ ! -f apk/nyers-kesz ] && ! git ls-remote --exit-code origin refs/heads/apk-nyers >/dev/null 2>&1; then
              NY="$RUNNER_TEMP/ny"
              git worktree add --detach "$NY" \
                && git -C "$NY" checkout -q --orphan apk-nyers \
                && git -C "$NY" rm -rq --cached . \
                && find "$NY" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + \
                && mkdir -p "$NY/apk" \
                && for f in "${big[@]}"; do split -b 90m -d "$f" "$NY/apk/$(basename "$f").part"; done \
                && git -C "$NY" add apk \
                && git -C "$NY" -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -q -m "Nagy csomagok darabolva (ideiglenes)" \
                && git -C "$NY" push origin HEAD:refs/heads/apk-nyers \
                || echo "A darabolt feltöltés nem sikerült"
            fi
          fi
          # a nyers kinyert képek ne kerüljenek az APK-ba, csak a párosítottak
          rm -rf apk assets/custom/raw assets/custom/_tmp assets/custom/map.example.json

      - name: Android projekt előkészítése
        run: npm run android

      - name: APK fordítása
        working-directory: android
        run: |
          mkdir -p ~/.android
          cp ../android-signing/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../TeenyTitans3.apk

      - name: APK feltöltése (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: teeny-titans-3-apk
          path: TeenyTitans3.apk
          if-no-files-found: error

      - name: Legújabb kiadás frissítése (közvetlen letöltés telefonra)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # mi került az APK-ba a saját fájlokból (így a kiadás oldalán látszik, működött-e a párosítás)
          TARTALOM=$(python3 -c "import json; m=json.load(open('assets/custom/manifest.json')); v=m.get('voice',{}); print('Saját TT2-tartalom: %d figura, %d 3D modell, %d harci háttér, %d zene, %d hangeffekt, %d támadáshang, %d bemondott név, %d szinkronhang.' % (len([k for k in m.get('figures',{}) if not k.startswith('acc_')]), len([k for k in m.get('models',{}) if not k.startswith('acc_')]), len(m.get('backgrounds',{})), len(m.get('music',{})), len(m.get('sfx',{})), len(m.get('moves',{})), sum(1 for k in v.values() if 'name' in k), sum(len(l) for k in v.values() for n, l in k.items() if n != 'name')))" 2>/dev/null || echo "Saját TT2-tartalom nélkül készült.")
          echo "$TARTALOM"
          for i in 1 2 3; do
            gh release delete legujabb --cleanup-tag -y || true
            sleep 3
            if gh release create legujabb TeenyTitans3.apk \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Teeny Titans 3 – legújabb (1.${{ github.run_number }})" \
              --notes "Automatikus build a(z) ${GITHUB_REF_NAME} ágról. Telefonon: töltsd le a TeenyTitans3.apk-t és telepítsd. A frissítés megtartja a mentést. $TARTALOM"; then
              # a gh piszkozatként hozza létre és utólag teszi közzé; ha ez elmaradt, közzétesszük
              sleep 3
              if [ "$(gh release view legujabb --json isDraft -q .isDraft)" = "true" ]; then
                gh release edit legujabb --draft=false --prerelease
              fi
              [ "$(gh release view legujabb --json isDraft -q .isDraft)" = "false" ] && exit 0
            fi
            sleep $((i * 10))
          done
          exit 1
