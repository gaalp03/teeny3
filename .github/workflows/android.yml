name: Android APK

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Függőségek
        run: npm ci --no-audit --no-fund

      - name: Saját textúrák (ha van feltöltött APK az apk-forras ágon)
        run: |
          if git fetch --depth 1 origin apk-forras 2>/dev/null; then
            git checkout FETCH_HEAD -- apk 2>/dev/null || true
            if [ -f apk/map.json ] && ls apk/*.apk >/dev/null 2>&1; then
              pip install --quiet UnityPy
              python3 tools/extract_apk.py extract apk/*.apk
              python3 tools/extract_apk.py map apk/map.json
            fi
            rm -rf apk
          fi

      - name: Android projekt előkészítése
        run: npm run android

      - name: APK fordítása
        working-directory: android
        run: |
          mkdir -p ~/.android
          cp ../android-signing/debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../TeenyTitans3.apk

      - name: APK feltöltése (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: teeny-titans-3-apk
          path: TeenyTitans3.apk
          if-no-files-found: error

      - name: Legújabb kiadás frissítése (közvetlen letöltés telefonra)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release delete legujabb --cleanup-tag -y || true
            sleep 3
            if gh release create legujabb TeenyTitans3.apk \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Teeny Titans 3 – legújabb (1.${{ github.run_number }})" \
              --notes "Automatikus build a(z) ${GITHUB_REF_NAME} ágról. Telefonon: töltsd le a TeenyTitans3.apk-t és telepítsd. A frissítés megtartja a mentést."; then
              exit 0
            fi
            sleep $((i * 10))
          done
          exit 1
